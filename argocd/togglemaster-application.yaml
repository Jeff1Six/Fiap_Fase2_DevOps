apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: togglemaster
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Jeff1Six/Fiap_Fase2_DevOps.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: desafio3

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
