apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: togglemaster-service-alerts
  namespace: monitoring
  labels:
    release: togglemaster-monitoring
spec:
  groups:
  - name: togglemaster.availability
    rules:
    - alert: ToggleMasterDeploymentUnavailable
      expr: kube_deployment_spec_replicas{namespace="desafio3"} > kube_deployment_status_replicas_available{namespace="desafio3"}
      for: 5m
      labels:
        severity: warning
        team: togglemaster
      annotations:
        summary: 'Deployment com réplicas indisponíveis: {{ $labels.deployment }}'
        description: O deployment {{ $labels.deployment }} no namespace desafio3 possui menos réplicas disponíveis que o desejado por
          5 minutos.
    - alert: ToggleMasterContainerRestarts
      expr: increase(kube_pod_container_status_restarts_total{namespace="desafio3"}[15m]) > 0
      for: 1m
      labels:
        severity: warning
        team: togglemaster
      annotations:
        summary: 'Reinício de contêiner detectado: {{ $labels.pod }}'
        description: O contêiner {{ $labels.container }} reiniciou nos últimos 15 minutos no namespace desafio3.

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: togglemaster-pagerduty
  namespace: monitoring
  labels:
    app: togglemaster-pagerduty
spec:
  route:
    receiver: pagerduty
    groupBy:
      - alertname
      - namespace
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    matchers:
      - name: team
        value: togglemaster
      - name: severity
        value: warning

  receivers:
    - name: pagerduty
      pagerdutyConfigs:
        - routingKey:
            name: pagerduty-credentials
            key: routing-key
          sendResolved: true
          severity: warning
          description: '{{ .CommonAnnotations.summary }}'
          client: ToggleMaster - FIAP Fase 4