apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-grafana-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  togglemaster-logs.json: |-
    {
      "id": null,
      "uid": "togglemaster-logs",
      "title": "ToggleMaster | Logs e erros",
      "description": "Logs das cinco APIs do namespace desafio3 via Alloy e Loki",
      "tags": [
        "togglemaster",
        "observabilidade",
        "loki",
        "gitops"
      ],
      "timezone": "browser",
      "schemaVersion": 40,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Fonte Loki",
            "type": "datasource",
            "query": "loki",
            "refresh": 1,
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 0
          },
          {
            "name": "service",
            "label": "Microsserviço",
            "type": "custom",
            "query": "auth-service,flag-service,evaluation-service,targeting-service,analytics-service",
            "options": [],
            "multi": true,
            "includeAll": true,
            "allValue": "auth-service|flag-service|evaluation-service|targeting-service|analytics-service",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Volume de logs por serviço",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 9,
            "w": 16,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (count_over_time({namespace=\"desafio3\",container=~\"$service\"} [5m]))",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "title": "Linhas com erro (15 min)",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"desafio3\",container=~\"$service\"} |~ \"(?i)(error|exception|fatal|panic|traceback)\" [15m]))",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "title": "Logs dos microsserviços",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 13,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"desafio3\",container=~\"$service\"}",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 4,
          "title": "Erros e exceções",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"desafio3\",container=~\"$service\"} |~ \"(?i)(error|exception|fatal|panic|traceback)\"",
              "queryType": "range",
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
