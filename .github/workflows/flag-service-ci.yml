name: Flag Service CI

on:
  push:
    branches: [main]
    paths:
      - "flag-service/**"
      - "k8s/**"
      - "terraform/**"
      - ".github/workflows/flag-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "flag-service/**"
      - "k8s/**"
      - "terraform/**"
      - ".github/workflows/flag-service-ci.yml"

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flag-service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Validate Python syntax
        run: python -m compileall .
      - name: Unit Tests
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No unit tests found - skipping tests."
          fi

  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: flag-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: |
          # Bloqueia erros críticos; o código legado ainda possui pendências
          # cosméticas que serão tratadas separadamente.
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Bandit SAST
        run: bandit -r flag-service -x flag-service/tests -lll -iii
      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: flag-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker Build
        working-directory: flag-service
        run: docker build --tag togglemaster-flag-service:${{ github.sha }} .
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-flag-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Read ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."flag"')
          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "ECR URL for flag-service was not found."
            exit 1
          fi
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag togglemaster-flag-service:${IMAGE_TAG} "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Read Terraform Outputs
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."flag"')
          if [ -z "${EKS_CLUSTER_NAME}" ] || [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "Required Terraform outputs were not found."
            exit 1
          fi
          echo "eks_cluster_name=${EKS_CLUSTER_NAME}" >> "$GITHUB_OUTPUT"
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        env:
          EKS_CLUSTER_NAME: ${{ steps.terraform-output.outputs.eks_cluster_name }}
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.generated.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-apps-deployments.yaml
          kubectl apply -f k8s/04-ingress-e-hpa.yaml

      - name: Update flag-service Image
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/flag-service flag-service="${ECR_URL}:${IMAGE_TAG}" -n desafio3

      - name: Wait for Rollout
        run: kubectl rollout status deployment/flag-service -n desafio3 --timeout=300s

      - name: Show Deployment Status
        run: kubectl get pods,services,deployments -n desafio3 -o wide
