name: Flag Service CI

on:
  push:
    branches: [main]
    paths:
      - "flag-service/**"
      - "terraform/**"
      - ".github/workflows/flag-service-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "flag-service/**"
      - "terraform/**"
      - ".github/workflows/flag-service-ci.yml"

env:
  AWS_REGION: us-east-1

jobs:
  # =========================================================
  # 1 - BUILD & UNIT TEST
  # =========================================================
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flag-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate Python syntax
        run: python -m compileall .

      - name: Unit Tests
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No unit tests found - skipping tests."
          fi

  # =========================================================
  # 2 - LINTER / STATIC ANALYSIS
  # =========================================================
  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: flag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  # =========================================================
  # 3 - SECURITY SCAN
  # =========================================================
  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit SAST
        run: bandit -r flag-service -x flag-service/tests -lll -iii

      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: flag-service
          severity: CRITICAL
          exit-code: "1"

  # =========================================================
  # 4 - DOCKER BUILD, SCAN & PUSH
  # =========================================================
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: read

    outputs:
      ecr_url: ${{ steps.terraform-output.outputs.ecr_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Build
        working-directory: flag-service
        run: |
          docker build \
            --tag togglemaster-flag-service:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-flag-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Read Flag ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."flag"')

          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "URL do flag-service não encontrada nos outputs."
            exit 1
          fi

          echo "ECR URL encontrada: ${ECR_URL}"
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            togglemaster-flag-service:${IMAGE_TAG} \
            "${ECR_URL}:${IMAGE_TAG}"

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${ECR_URL}:${IMAGE_TAG}"

  # =========================================================
  # 5 - UPDATE GITOPS
  # =========================================================
  gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Flag Service Image
        env:
          ECR_URL: ${{ needs.docker.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          file_path = Path("k8s/03-apps-deployments.yaml")

          image = f"{os.environ['ECR_URL']}:{os.environ['IMAGE_TAG']}"

          content = file_path.read_text()

          pattern = r'^(\s*image:\s*).*(?:togglemaster-)?flag-service:[^\s]+'

          new_content, count = re.subn(
            pattern,
            lambda match: f"{match.group(1)}{image}",
            content,
            count=1,
            flags=re.MULTILINE
          )

          if count == 0:
            raise Exception(
              "Imagem do flag-service não encontrada em k8s/03-apps-deployments.yaml"
            )

          file_path.write_text(new_content)

          print(f"Imagem atualizada para: {image}")
          PY

      - name: Show GitOps Changes
        run: git diff -- k8s/03-apps-deployments.yaml

      - name: Commit GitOps Change
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/03-apps-deployments.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git commit \
            -m "chore(gitops): update flag-service image to ${IMAGE_TAG}"

          git push
