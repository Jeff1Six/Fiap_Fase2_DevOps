name: Evaluation Service CI

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - "k8s/**"
      - "terraform/**"
      - ".github/workflows/evaluation-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - "k8s/**"
      - "terraform/**"
      - ".github/workflows/evaluation-service-ci.yml"

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: evaluation-service/go.mod
          cache-dependency-path: evaluation-service/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Unit Tests
        run: go test -race -cover ./...

  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest
    needs: build-test
    defaults:
      run:
        working-directory: evaluation-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: evaluation-service/go.mod
          cache-dependency-path: evaluation-service/go.sum
      - name: Go Vet
        run: go vet ./...
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: evaluation-service

  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Gosec SAST
        uses: securego/gosec@master
        with:
          args: ./evaluation-service/...
      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: evaluation-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker Build
        working-directory: evaluation-service
        run: docker build --tag togglemaster-evaluation-service:${{ github.sha }} .
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-evaluation-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Read ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."evaluation"')
          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "ECR URL for evaluation-service was not found."
            exit 1
          fi
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag togglemaster-evaluation-service:${IMAGE_TAG} "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:${IMAGE_TAG}"

  # =========================================================
  # 5 - DEPLOY TO EKS
  # =========================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Read EKS Cluster Name
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)

          if [ -z "${EKS_CLUSTER_NAME}" ]; then
            echo "Nome do cluster EKS não encontrado."
            exit 1
          fi

          echo "eks_cluster_name=${EKS_CLUSTER_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        env:
          EKS_CLUSTER_NAME: ${{ steps.terraform-output.outputs.eks_cluster_name }}
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Check EKS Nodes
        run: kubectl get nodes

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.generated.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-apps-deployments.yaml
          kubectl apply -f k8s/04-ingress-e-hpa.yaml

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Evaluation Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: togglemaster-evaluation-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/evaluation-service \
            evaluation-service="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -n desafio3

      - name: Wait for evaluation Service Rollout
        run: |
          kubectl rollout status \
            deployment/evaluation-service \
            -n desafio3 \
            --timeout=300s

      - name: Show Deployment Status
        run: |
          echo "===== NODES ====="
          kubectl get nodes

          echo "===== PODS ====="
          kubectl get pods -n desafio3 -o wide

          echo "===== SERVICES ====="
          kubectl get svc -n desafio3

          echo "===== DEPLOYMENTS ====="
          kubectl get deployments -n desafio3
