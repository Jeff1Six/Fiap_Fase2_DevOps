name: Analytics Service CI

on:
  push:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - "terraform/**"
      - ".github/workflows/analytics-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - "terraform/**"
      - ".github/workflows/analytics-service-ci.yml"

env:
  AWS_REGION: us-east-1

jobs:
  # =========================================================
  # 1 - BUILD & UNIT TEST
  # =========================================================
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Python syntax
        run: python -m compileall .

      - name: Unit Tests
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No unit tests found - skipping tests."
          fi

  # =========================================================
  # 2 - LINTER / STATIC ANALYSIS
  # =========================================================
  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

  # =========================================================
  # 3 - SECURITY SCAN
  # =========================================================
  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit SAST
        run: |
          bandit \
            -r analytics-service \
            -x analytics-service/tests \
            -lll \
            -iii

      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: analytics-service
          severity: CRITICAL
          exit-code: "1"

  # =========================================================
  # 4 - DOCKER BUILD, SCAN & PUSH
  # =========================================================
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: read

    outputs:
      ecr_url: ${{ steps.terraform-output.outputs.ecr_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Build
        working-directory: analytics-service
        run: |
          docker build \
            --tag togglemaster-analytics-service:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-analytics-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      # -------------------------------------------------------
      # DAQUI PARA BAIXO SOMENTE PUSH NA MAIN
      # -------------------------------------------------------

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "togglemaster-dev"

          echo "Contexto Kubernetes:"
          kubectl config current-context

          echo "Validando acesso ao cluster:"
          kubectl get nodes
          kubectl get namespace desafio3

      - name: Update AWS credentials in Kubernetes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          kubectl create secret generic aws-credentials \
            --namespace desafio3 \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Secret AWS atualizado no Kubernetes:"
          kubectl get secret aws-credentials -n desafio3

      - name: Setup Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Read Analytics ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."analytics"')

          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "ERRO: URL do analytics-service não encontrada nos outputs."
            exit 1
          fi

          echo "ECR URL encontrada: ${ECR_URL}"
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Validate Analytics ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
        shell: bash
        run: |
          if [ -z "${ECR_URL}" ]; then
            echo "ERRO: ECR_URL está vazio."
            exit 1
          fi

          echo "ECR utilizado:"
          echo "${ECR_URL}"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          docker tag \
            togglemaster-analytics-service:${IMAGE_TAG} \
            "${ECR_URL}:${IMAGE_TAG}"

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          docker push "${ECR_URL}:${IMAGE_TAG}"

  # =========================================================
  # 5 - UPDATE GITOPS
  # =========================================================

  gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Todos os microserviços usam o MESMO grupo.
    # Assim somente um job GitOps altera a main por vez.
    concurrency:
      group: togglemaster-gitops-main
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Analytics image and push
        env:
          ECR_URL: ${{ needs.docker.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: analytics-service
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ECR_URL}" ]; then
            echo "ERRO: ECR_URL está vazio."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "Tentativa $ATTEMPT de $MAX_RETRIES"

            # Sempre parte da main remota mais recente.
            # Isso evita rebase com conflito e nunca mantém marcadores <<<<<<< no arquivo.
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import os
          import re
          from pathlib import Path

          file_path = Path("k8s/03-apps-deployments.yaml")
          service = os.environ["SERVICE_NAME"]
          ecr_url = os.environ["ECR_URL"]
          image_tag = os.environ["IMAGE_TAG"]
          image = f"{ecr_url}:{image_tag}"

          content = file_path.read_text(encoding="utf-8")

          # Falha imediatamente se o manifesto já estiver contaminado por conflito Git.
          conflict_markers = ("<<<<<<<", "=======", ">>>>>>>")
          if any(marker in content for marker in conflict_markers):
              raise RuntimeError(
                  "O manifesto contém marcadores de conflito Git. "
                  "Corrija k8s/03-apps-deployments.yaml antes de continuar."
              )

          # Analisa cada documento YAML sem reformatar o arquivo inteiro.
          # Somente a linha image: do Deployment/container correto será substituída.
          doc_pattern = re.compile(
              r"(?ms)(?:\A|^---[ \t]*\r?\n)(.*?)(?=^---[ \t]*$|\Z)"
          )

          updated_content = None

          for match in doc_pattern.finditer(content):
              document = match.group(1)

              if not re.search(r"(?m)^\s*kind:\s*Deployment\s*$", document):
                  continue

              if not re.search(
                  rf"(?m)^\s*name:\s*{re.escape(service)}\s*$",
                  document
              ):
                  continue

              image_pattern = re.compile(
                  rf"(?ms)"
                  rf"(^\s*-\s*name:\s*{re.escape(service)}\s*$"
                  rf".*?"
                  rf"^\s*image:\s*)"
                  rf"[^\r\n]+"
              )

              updated_document, count = image_pattern.subn(
                  lambda m: m.group(1) + image,
                  document,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      f"Linha image do container {service} não encontrada."
                  )

              start, end = match.span(1)
              updated_content = (
                  content[:start] + updated_document + content[end:]
              )
              break

          if updated_content is None:
              raise RuntimeError(
                  f"Deployment {service} não encontrado em {file_path}."
              )

          file_path.write_text(updated_content, encoding="utf-8")
          print(f"Imagem do {service} atualizada para: {image}")
          PY

            echo "===== ALTERAÇÕES GITOPS ====="
            git diff -- k8s/03-apps-deployments.yaml

            CHANGED_FILES=$(git diff --name-only)

            if [ "${CHANGED_FILES}" != "k8s/03-apps-deployments.yaml" ]; then
              echo "ERRO: arquivos inesperados foram modificados:"
              echo "${CHANGED_FILES}"
              exit 1
            fi

            IMAGE_CHANGES=$(git diff --unified=0 -- k8s/03-apps-deployments.yaml | \
              grep -E '^[+-][[:space:]]*image:' || true)

            REMOVED_COUNT=$(echo "${IMAGE_CHANGES}" | grep -c '^-' || true)
            ADDED_COUNT=$(echo "${IMAGE_CHANGES}" | grep -c '^+' || true)

            if [ "${REMOVED_COUNT}" -ne 1 ] || [ "${ADDED_COUNT}" -ne 1 ]; then
              echo "ERRO: o workflow deveria alterar somente uma imagem."
              echo "${IMAGE_CHANGES}"
              exit 1
            fi

            git add k8s/03-apps-deployments.yaml

            if git diff --cached --quiet; then
              echo "Nenhuma alteração necessária."
              exit 0
            fi

            git commit -m "chore(gitops): update ${SERVICE_NAME} image to ${IMAGE_TAG}"

            if git push origin HEAD:main; then
              echo "Push GitOps realizado com sucesso."
              exit 0
            fi

            echo "A main mudou antes do push. Reaplicando a alteração sobre a versão mais recente..."
            sleep $((ATTEMPT * 2))
          done

          echo "ERRO: não foi possível atualizar a main após $MAX_RETRIES tentativas."
          exit 1
