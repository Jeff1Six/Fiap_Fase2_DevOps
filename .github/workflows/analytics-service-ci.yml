name: Analytics Service CI

on:
  push:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-service-ci.yml"

jobs:

  # =========================================================
  # 1 - BUILD & UNIT TEST
  # =========================================================
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Python syntax
        run: python -m compileall .

      - name: Unit Tests
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest
          else
            echo "No unit tests found - skipping tests."
          fi
        continue-on-error: true


  # =========================================================
  # 2 - LINTER / STATIC ANALYSIS
  # =========================================================
  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest

    needs: build-test

    defaults:
      run:
        working-directory: analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . \
            --count \
            --show-source \
            --statistics


  # =========================================================
  # 3 - SECURITY SCAN
  # =========================================================
  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest

    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # SAST
      # ----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit SAST
        run: |
          bandit -r analytics-service \
            -x analytics-service/tests

      # ----------------------------
      # SCA
      # ----------------------------
      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: analytics-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  # =========================================================
  # 4 - DOCKER BUILD & PUSH
  # =========================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    needs: security

    defaults:
      run:
        working-directory: analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Build
        run: |
          docker build \
            -t togglemaster-analytics:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-analytics:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # =====================================================
      # ECR - somente após merge / push na main
      # =====================================================

      - name: Generate Image Tag
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=v1.0.${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            togglemaster-analytics:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ANALYTICS_ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ANALYTICS_ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}