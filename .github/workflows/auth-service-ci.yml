name: Auth Service CI

on:
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service-ci.yml"

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Unit Tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: ./auth-service/...

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: auth-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Docker Build
        run: |
          docker build \
            -t togglemaster-auth:${{ github.sha }} \
            .

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-auth:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true