name: Auth Service CI

on:
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - "terraform/**"
      - ".github/workflows/auth-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - "terraform/**"
      - ".github/workflows/auth-service-ci.yml"

env:
  AWS_REGION: us-east-1

jobs:
  # =========================================================
  # 1 - BUILD & UNIT TEST
  # =========================================================
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Unit Tests
        run: go test ./...

  # =========================================================
  # 2 - LINTER / STATIC ANALYSIS
  # =========================================================
  lint:
    name: Linter & Static Analysis
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: auth-service

  # =========================================================
  # 3 - SECURITY SCAN
  # =========================================================
  security:
    name: Security Scan - SAST & SCA
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gosec SAST
        uses: securego/gosec@master
        with:
          args: ./auth-service/...

      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: auth-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # =========================================================
  # 4 - DOCKER BUILD, SCAN & PUSH
  # =========================================================
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Build
        working-directory: auth-service
        run: |
          docker build \
            --tag togglemaster-auth:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: togglemaster-auth:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform init -input=false

      - name: Read Auth ECR URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: terraform-output
        working-directory: terraform
        shell: bash
        run: |
          ECR_URL=$(terraform output -json ecr_repository_urls | jq -r '."auth"')

          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "URL do auth-service não encontrada nos outputs."
            exit 1
          fi

          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            togglemaster-auth:${IMAGE_TAG} \
            "${ECR_URL}:${IMAGE_TAG}"

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_URL: ${{ steps.terraform-output.outputs.ecr_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${ECR_URL}:${IMAGE_TAG}"
